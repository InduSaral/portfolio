<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Science teacher portfolio"><title>Indu Saral | Science Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--bg:#fff9f1;--surface:#fffefd;--ink:#283b35;--muted:#687970;--primary:#326957;--primaryText:#fff;--accent:#ffe98c;--soft1:#d8f1df;--soft2:#ffd8e2;--soft3:#e4ddff;--radius:26px;--heading:Nunito,sans-serif;--body:"DM Sans",sans-serif;--speed:750ms}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow-x:hidden}a{color:inherit;text-decoration:none}.container{max-width:1120px}.nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid #0001;padding:14px 0}.navinner{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font:900 1.15rem var(--heading)}.brandlogo{width:40px;height:40px;object-fit:contain;border-radius:50%;margin-right:8px;vertical-align:middle}.links{display:flex;gap:18px;align-items:center;font-size:.86rem;font-weight:700}.btnx{display:inline-block;background:var(--primary);color:var(--primaryText);border-radius:99px;padding:12px 18px;font-weight:800;border:0}.btn-lightx{background:var(--surface);color:var(--ink);border:1px solid #0002}.hero{padding:78px 0 66px}.eyebrow,.kicker{font-size:.75rem;text-transform:uppercase;letter-spacing:.13em;font-weight:900;color:var(--primary)}.hero h1{font:900 clamp(3.2rem,7vw,6rem)/.98 var(--heading);letter-spacing:-.07em;margin:20px 0}.highlight{background:linear-gradient(transparent 65%,var(--accent) 65%)}.lead{max-width:600px;color:var(--muted);line-height:1.8;font-size:1.05rem}.heroart{min-height:330px;display:grid;place-items:center;position:relative}.blob{position:absolute;width:78%;height:90%;background:var(--soft2);border-radius:45% 55% 52% 48%;animation:float 8s ease-in-out infinite alternate}.portrait{position:relative;width:260px;height:300px;border:8px solid var(--surface);border-radius:46% 46% 24px 24px;background:linear-gradient(140deg,var(--soft1),var(--soft3));box-shadow:0 20px 45px #0001;display:grid;place-items:center;text-align:center}.portrait .emoji{font-size:100px}.portrait small{font-weight:800;letter-spacing:.1em}.note{position:absolute;background:var(--surface);padding:12px 14px;border-radius:16px;box-shadow:0 10px 25px #0001;font-weight:800;font-size:.78rem}.note.one{top:30px;left:0;transform:rotate(-5deg)}.note.two{bottom:35px;right:0;background:var(--accent);transform:rotate(4deg)}@keyframes float{to{transform:rotate(5deg);border-radius:55% 45% 40% 60%}}.trust{background:var(--primary);color:var(--primaryText);padding:17px 0;display:flex;justify-content:space-around;gap:14px;flex-wrap:wrap;font-size:.78rem;font-weight:800}.section{padding:78px 0}.title{font:900 clamp(2.3rem,5vw,4rem)/1.03 var(--heading);letter-spacing:-.06em;margin:12px 0 18px}.muted{color:var(--muted);line-height:1.8}.cardx{background:var(--surface);border:1px solid #0001;border-radius:var(--radius);padding:28px;height:100%;box-shadow:0 12px 35px #00000008}.quote{background:var(--soft3);border-radius:var(--radius);padding:30px;font:900 1.8rem/1.2 var(--heading);letter-spacing:-.04em}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.chip{background:var(--bg);border:1px solid #0002;border-radius:99px;padding:7px 11px;font-size:.78rem;font-weight:700}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.stat{background:var(--bg);padding:14px;border-radius:14px;min-width:110px}.stat b{display:block;font:900 1.3rem var(--heading)}.stat small{color:var(--muted)}.item{padding:0 0 25px 20px;border-left:2px solid var(--soft1);position:relative}.item:before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--primary);outline:3px solid var(--bg)}.date{font-size:.72rem;color:var(--primary);font-weight:900;letter-spacing:.08em}.item h3,.project h3{font:900 1.2rem var(--heading);margin:6px 0}.project{border:1px solid #0001;border-radius:var(--radius);overflow:hidden;background:var(--surface);height:100%}.projectart{min-height:155px;display:grid;place-items:center;text-align:center;font:900 2rem/1 var(--heading);letter-spacing:-.05em;padding:20px}.projectbody{padding:20px}.testimonial{background:var(--primary);color:var(--primaryText);border-radius:var(--radius);padding:35px;font:800 clamp(1.5rem,3vw,2.5rem)/1.2 var(--heading)}.contact{background:var(--soft2);border-radius:var(--radius);padding:35px}.footer{padding:25px 0;color:var(--muted);font-size:.8rem}.hidden{display:none!important}.resume-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.custom-section{position:relative}.section[data-custom="true"]{padding:48px 0}.custom-section h2{font:900 2rem var(--heading)}.small-note{font-size:.75rem;color:var(--muted)}@media(max-width:760px){.links a:not(.btnx){display:none}.hero{padding-top:48px}.heroart{min-height:300px}.portrait{height:260px;width:225px}.section{padding:55px 0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
<header class="nav"><div class="container navinner"><a class="brand" href="#top"><img class="brandlogo" src="media/indu-saral-logo.png" alt="Indu Saral logo"><span id="brandName">Indu Saral</span></a><nav class="links"><a href="#about">About</a><a href="#journey">Experience</a><a href="#projects">Classroom</a><a href="#contact">Contact</a><a class="btnx" href="resume.html">Download résumé ↗</a></nav></div></header>
<main id="top">
<section class="hero"><div class="container"><div class="row align-items-center g-4"><div class="col-lg-7"><div class="eyebrow" id="heroEyebrow"></div><h1 id="heroHeading"></h1><p class="lead" id="heroText"></p><div class="d-flex gap-2 flex-wrap mt-4"><a class="btnx" id="heroButton" href="#about">Explore my journey</a><a class="btnx btn-lightx" href="resume.html">Download résumé ↓</a></div><p class="muted mt-4" id="tagline"></p></div><div class="col-lg-5"><div class="heroart"><div class="blob"></div><div class="note one" id="note1"></div><div class="note two" id="note2"></div><div class="portrait" id="portrait"><div><img src="media/indu-saral-logo.png" alt="Indu Saral Teacher logo" style="width:100%;height:100%;object-fit:contain;background:#fffaf1;border-radius:inherit;padding:10px"></div></div></div></div></div></div></section>
<div class="trust" id="trust"></div>
<section class="section" id="about"><div class="container"><div class="row g-4"><div class="col-lg-4"><div class="quote">“Every question is the beginning of a discovery.”</div></div><div class="col-lg-8"><div class="cardx"><div class="kicker" id="aboutKicker"></div><h2 class="title" id="aboutHeading"></h2><p class="muted" id="about1"></p><p class="muted" id="about2"></p><div class="chips" id="skills"></div><div class="stats"><div class="stat"><b id="years"></b><small>Teaching</small></div><div class="stat"><b id="grades"></b><small>Grade range</small></div><div class="stat"><b id="subject"></b><small>Subject</small></div></div></div></div></div></div></section>
<section class="section" id="approach"><div class="container"><div class="kicker" id="approachKicker"></div><h2 class="title" id="approachHeading"></h2><p class="muted mb-4" id="approachIntro"></p><div class="row g-3" id="approaches"></div></div></section>
<section class="section" id="journey" style="background:color-mix(in srgb,var(--soft1) 30%,var(--bg))"><div class="container"><div class="row g-4"><div class="col-lg-5"><div class="kicker" id="journeyKicker"></div><h2 class="title" id="journeyHeading"></h2><p class="muted" id="journeyIntro"></p><p id="journeyNote"></p></div><div class="col-lg-7"><div id="experience"></div><h3 class="mt-3" style="font:900 1.4rem var(--heading)">Education</h3><div id="education"></div></div></div></div></section>
<section class="section" id="projects"><div class="container"><div class="kicker" id="projectsKicker"></div><h2 class="title" id="projectsHeading"></h2><p class="muted mb-4" id="projectsIntro"></p><div class="row g-3" id="projectsList"></div></div></section>
<div id="customSections"></div>
<section class="section" id="philosophy"><div class="container"><div class="testimonial"><div class="kicker mb-3" style="color:var(--accent)" id="philosophyLabel"></div><span id="philosophyQuote"></span><div class="small mt-3" style="font:700 .8rem var(--body)" id="philosophyBy"></div></div></div></section>
<section class="section" id="contact"><div class="container"><div class="contact"><div class="kicker" id="contactKicker"></div><h2 class="title" id="contactHeading"></h2><p class="muted" id="contactText"></p><div class="resume-actions" id="contactActions"></div></div></div></section>
</main><footer class="footer"><div class="container d-flex justify-content-between flex-wrap gap-2"><span>© <span id="year"></span> <span id="footerName"></span></span><span id="footerLine"></span></div></footer>
<script>
const $=id=>document.getElementById(id), text=(id,v)=>{if($(id))$(id).textContent=v||""}, html=(id,v)=>{if($(id))$(id).innerHTML=v||""};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const palettes={garden:["#fff9f1","#fffefd","#283b35","#687970","#326957","#ffffff","#ffe98c","#d8f1df","#ffd8e2","#e4ddff"],ocean:["#f2fbff","#ffffff","#183849","#607b88","#176b87","#ffffff","#ffd98e","#c9f0ed","#cde5ff","#dce0ff"],sunset:["#fff8f2","#ffffff","#482f37","#846873","#b64d62","#ffffff","#ffd17d","#ffe2ce","#ffd6df","#f0d9ff"],lavender:["#faf7ff","#ffffff","#302b48","#77718e","#6b58a5","#ffffff","#ffe5a4","#dff3ec","#f9ddeb","#e5dcff"],monochrome:["#f7f7f5","#ffffff","#252525","#666666","#292929","#ffffff","#e7e7e2","#e9ece7","#eeeeeb","#e3e2e8"]};
function theme(t={}){let p=palettes[t.preset]||palettes.garden;let keys=["background","surface","text","muted","primary","primaryText","accent","softOne","softTwo","softThree"],vars=["--bg","--surface","--ink","--muted","--primary","--primaryText","--accent","--soft1","--soft2","--soft3"];keys.forEach((k,i)=>document.documentElement.style.setProperty(vars[i],/^#[0-9a-f]{6}$/i.test(t[k]||"")?t[k]:p[i]));document.documentElement.style.setProperty("--heading",'"'+(t.font||"Nunito")+'",sans-serif');document.documentElement.style.setProperty("--body",'"'+(t.bodyFont||"DM Sans")+'",sans-serif');document.documentElement.style.setProperty("--radius",(t.radius||26)+"px");}
function listItems(arr,fn){return (arr||[]).map(fn).join("")}
function render(d){theme(d.theme);document.title=d.siteTitle||d.name;text("brandName",d.name);text("heroEyebrow",d.heroEyebrow);html("heroHeading",d.heroHeading);text("heroText",d.heroText);text("tagline",d.tagline);text("note1",d.floatingNoteOne);text("note2",d.floatingNoteTwo);text("aboutKicker",d.aboutKicker);html("aboutHeading",d.aboutHeading);text("about1",d.aboutParagraphOne);text("about2",d.aboutParagraphTwo);html("skills",listItems(d.skills,s=>`<span class="chip">${esc(s)}</span>`));text("years",d.yearsTeaching);text("grades",d.studentsInspired);text("subject",d.subjectsGrades);text("approachKicker",d.approachKicker);html("approachHeading",d.approachHeading);text("approachIntro",d.approachIntro);html("approaches",listItems(d.approaches,a=>`<div class="col-md-4"><article class="cardx"><div style="font-size:2rem">${esc(a.icon)}</div><h3 style="font:900 1.3rem var(--heading)">${esc(a.title)}</h3><p class="muted">${esc(a.text)}</p></article></div>`));text("journeyKicker",d.journeyKicker);html("journeyHeading",d.journeyHeading);text("journeyIntro",d.journeyIntro);text("journeyNote",d.journeyNote);html("experience",listItems(d.experience,e=>`<div class="item"><div class="date">${esc(e.date)}</div><h3>${esc(e.title)}</h3><p class="muted">${esc(e.text)}</p></div>`));html("education",listItems(d.education,e=>`<div class="item"><div class="date">${esc(e.date)}</div><h3>${esc(e.title)}</h3><p class="muted">${esc(e.text)}</p></div>`));text("projectsKicker",d.projectsKicker);html("projectsHeading",d.projectsHeading);text("projectsIntro",d.projectsIntro);html("projectsList",listItems(d.projects,p=>`<div class="col-md-6 col-lg-3"><article class="project"><div class="projectart" style="background:${/^#[0-9a-f]{6}$/i.test(p.accent||"")?p.accent:"#ffe98c"}">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.imageAlt)}" style="width:100%;height:100%;object-fit:cover">`:p.artText}</div><div class="projectbody"><div class="kicker">${esc(p.tag)}</div><h3>${esc(p.title)}</h3><p class="muted">${esc(p.text)}</p></div></article></div>`));text("philosophyLabel",d.philosophyLabel);text("philosophyQuote",d.philosophyQuote);text("philosophyBy",d.philosophyAttribution);text("contactKicker",d.contactKicker);html("contactHeading",d.contactHeading);text("contactText",d.contactText);let acts=[];if(d.email)acts.push(`<a class="btnx" href="mailto:${esc(d.email)}">Email me ↗</a>`);if(d.phone)acts.push(`<a class="btnx btn-lightx" href="tel:${esc(d.phone)}">Call me</a>`);acts.push(`<a class="btnx btn-lightx" href="resume.html">Download résumé PDF ↓</a>`);html("contactActions",acts.join(""));text("footerName",d.name);text("footerLine",d.footerLine);text("year",new Date().getFullYear());
if(d.portrait){$("portrait").innerHTML=`<img src="${esc(d.portrait)}" alt="${esc(d.portraitAlt)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`}
html("trust",listItems(d.trustItems,s=>`<span>✦ ${esc(s)}</span>`));
html("customSections",listItems((d.customSections||[]).filter(s=>s.visible!==false),s=>`<section class="section" data-custom="true" id="custom-${esc(s.id)}"><div class="container"><div class="kicker">${esc(s.eyebrow||"")}</div><h2 class="title">${esc(s.title||"")}</h2><p class="muted">${esc(s.body||"")}</p>${listItems(s.cards||[],c=>`<div class="cardx my-2"><h3>${esc(c.title||"")}</h3><p class="muted">${esc(c.body||"")}</p></div>`)}</div></section>`));
const flags={trust:"showTrustStrip",approach:"showApproach",journey:"showExperience",projects:"showProjects",philosophy:"showPhilosophy",contact:"showContact"};Object.entries(flags).forEach(([id,k])=>{if(d.theme?.[k]===false)$(id).classList.add("hidden")});
if(d.heroButtonTarget)$("heroButton").href=d.heroButtonTarget;
}
fetch("content/site.json").then(r=>r.json()).then(render).catch(()=>document.querySelector("main").innerHTML="<div class='container section'><h1>Portfolio content could not load.</h1><p>Check content/site.json and use GitHub Pages or a local server.</p></div>");
</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
