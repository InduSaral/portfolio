</style></head><body><div class="toolbar"><a class="secondary" href="index.html">← Back to portfolio</a><span style="font-weight:800">A4 Resume · Live portfolio details</span><button onclick="window.print()">Download resume / Save as PDF ↓</button></div><article class="page" id="resume"><header class="top"><h1 class="name" id="name">Indu Saral</h1><div class="subtitle" id="role"></div><div class="contact" id="contact"></div></header><div class="summary" id="summary"></div><section class="section" id="skillsSec"><h2 class="section-title">Core skills</h2><div class="skills" id="skills"></div></section><section class="section" id="experienceSec"><h2 class="section-title">Professional experience</h2><div id="experience"></div></section><section class="section" id="educationSec"><h2 class="section-title">Education</h2><div id="education"></div></section><section class="section" id="activitiesSec"><h2 class="section-title">Activities & certifications</h2><div id="activities"></div></section><div class="bottom-note">Indu Saral · Science Teacher</div></article>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
fetch("content/site.json").then(r=>r.json()).then(d=>{
 document.title=(d.name||"Teacher")+" — Resume";$("name").textContent=d.name||"";$("role").textContent=d.role||"";
 const c=[];if(d.address)c.push("⌖ "+d.address);if(d.phone)c.push("☎ "+d.phone);if(d.email)c.push("✉ "+d.email);$("contact").innerHTML=c.map(x=>`<span>${esc(x)}</span>`).join("");
 $("summary").textContent=(d.resume?.summary)||`${d.name||"The candidate"} is a science educator focused on clear concept-building, student-centred learning, structured lessons, and a supportive classroom environment.`;
 $("skills").innerHTML=(d.skills||[]).map(x=>`<span class="skill">${esc(x)}</span>`).join("");
 $("experience").innerHTML=(d.experience||[]).map(e=>`<div class="entry"><div class="entryhead"><h3>${esc(e.title)}</h3><span class="date">${esc(e.date)}</span></div><p>${esc(e.text)}</p></div>`).join("");
 $("education").innerHTML=(d.education||[]).map(e=>`<div class="entry"><div class="entryhead"><h3>${esc(e.title)}</h3><span class="date">${esc(e.date)}</span></div><p>${esc(e.text)}</p></div>`).join("");
 const extra=(d.customSections||[]).filter(s=>s.visible!==false).map(s=>`<div class="entry"><h3>${esc(s.title)}</h3><p>${esc(s.body)}</p></div>`).join("");
 $("activities").innerHTML=extra||"<p>Additional activities and certifications can be added in the portfolio editor.</p>";
 if(d.resume?.showAddress===false||d.resume?.showPhone===false||d.resume?.showEmail===false){let spans=[...$("contact").children];spans.forEach(s=>{if(d.resume.showAddress===false&&s.textContent.startsWith("⌖"))s.remove();if(d.resume.showPhone===false&&s.textContent.startsWith("☎"))s.remove();if(d.resume.showEmail===false&&s.textContent.startsWith("✉"))s.remove()})}
 if(d.resume?.showSkills===false)$("skillsSec").hidden=true;if(d.resume?.showActivities===false)$("activitiesSec").hidden=true;
}).catch(()=>{$("resume").innerHTML="<h1>Resume data could not load</h1><p>Check content/site.json and open the site through GitHub Pages or a local server.</p>"});
</script></body></html>
